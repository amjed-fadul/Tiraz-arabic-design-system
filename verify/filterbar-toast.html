<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tiraz FilterBar and Toast verification</title>
    <style>
      body {
        margin: 0;
        background: #e9eceb;
        color: #17221d;
        font: 16px system-ui;
      }
      main {
        padding: 24px;
      }
      .panels {
        display: flex;
        gap: 32px;
        flex-wrap: wrap;
      }
      .panel {
        width: 460px;
        display: grid;
        gap: 16px;
        align-content: start;
      }
      .panel > .tiraz-system {
        display: grid;
        gap: 16px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      output {
        display: block;
        font:
          12px ui-monospace,
          monospace;
        color: #3e4d45;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./filterbar-toast.tsx"></script>
  </body>
</html>
